{% extends "layout.html" %}
{% block title %}AI 연결·모델 - 관리자{% endblock %}
{% block content %}
<div class="container" id="ai-page">
  <header class="page-header">
    <h1>AI 연결·모델</h1>
    <p>제공자 연결 → 모델 등록 → 역할 시험 → 작성 기본값·호출 설정</p>
  </header>
  <p id="ai-status" role="status" aria-live="polite">설정을 불러오는 중입니다.</p>
  <p id="ai-error" role="alert" tabindex="-1" hidden></p>
  <button type="button" id="ai-refresh">설정 다시 불러오기</button>
  <div id="ai-content"></div>
  <section id="ai-editor" aria-label="선택한 작업" hidden></section>
</div>
<style>
  #ai-page section { margin: 1.5rem 0; }
  #ai-page article { border: 1px solid var(--color-border-light); padding: 1rem; min-width: 0; }
  #ai-page p, #ai-page h3 { overflow-wrap: anywhere; }
  #ai-page .ai-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap: 1rem; }
  #ai-page .ai-actions { display: flex; flex-wrap: wrap; gap: .5rem; margin: .75rem 0; }
  #ai-page fieldset { padding: 1rem; margin-bottom: 1rem; min-width: 0; }
  #ai-page [hidden] { display: none; }
</style>
<script type="module" src="/static/js/ai-connections.js"></script>
{% endblock %}
